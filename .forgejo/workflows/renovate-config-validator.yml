name: renovate-config-validator
on:
  workflow_dispatch:
  push:
    paths:
      - 'renovate.json'
      - '.forgejo/workflows/renovate-config-validator.yml'

jobs:
  renovate-config-validator:
    runs-on: podman-unprivileged
    container:
      image: ghcr.io/renovatebot/renovate:44@sha256:6922c734849f2ed1c01e3a7924bd60e25e0ea904731a67bad72b02d563c0c3c3
    strategy:
      fail-fast: true
      matrix:
        config-file:
          - 'renovate.json'

    steps:
      - name: checkout repository
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: validate renovate configuration
        env:
          CONFIG_FILE: ${{ matrix.config-file }}
        shell: bash --noprofile --norc -e -o nounset -o pipefail {0}
        run: |
          renovate-config-validator --strict --no-global "${CONFIG_FILE}"
